aid: cloudpost-networks
name: Cloudpost Networks
description: CloudPost Networks is a Santa Clara, California device-security company founded in 2015 that
  rebranded as Ordr (ordr.net). It builds an AI-powered device intelligence and network-security platform
  that discovers, classifies, and secures connected devices across IT, IoT, OT, and IoMT environments,
  tying device identity to behavioral analytics so organizations can detect risk and automatically apply
  micro-segmentation and enforcement policies. Ordr serves 500+ healthcare, banking, and manufacturing
  organizations and integrates with vendors such as Cisco, Palo Alto Networks, CrowdStrike, and Fortinet.
  It maintains SOC 2 Type 2 compliance. No public developer API, OpenAPI, or developer portal is published.
